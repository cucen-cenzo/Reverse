<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>godfather</title>
<style>
  :root {
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", sans-serif;
    --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;

    --bg: #000000;
    --fg: #eceef2;
    --muted: #a0a8b4;
    --subtle: #616a77;
    --wash: rgba(255, 255, 255, 0.09);
    --field: #0b0d11;
    --border: rgba(255, 255, 255, 0.14);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html {
    color-scheme: dark;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background: var(--bg);
  }

  body {
    margin: 0;
    min-height: 100svh;
    background: transparent;
    color: var(--fg);
    font-family: var(--sans);
    letter-spacing: -0.01em;
    overflow-x: hidden;
  }

  /* faint soft light behind the glass so it has something to bend */
  .orbs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .orbs i {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.32;
    animation: drift 32s ease-in-out infinite alternate;
  }
  .orbs i:nth-child(1) { width: 20rem; height: 20rem; top: -5rem; left: -6rem; background: #3c5fb8; }
  .orbs i:nth-child(2) { width: 18rem; height: 18rem; top: 42%; right: -7rem; background: #5a4bb0; animation-duration: 40s; }
  .orbs i:nth-child(3) { width: 19rem; height: 19rem; bottom: -7rem; left: 22%; background: #2b8a90; animation-duration: 36s; }
  @keyframes drift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(2.5rem, 2rem, 0) scale(1.12); }
  }

  ::selection { background: var(--fg); color: var(--bg); }

  main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    min-height: 100svh;
    width: 100%;
    max-width: 30rem;
    margin: 0 auto;
    padding: 2rem 1.25rem;
  }
  @media (min-width: 640px) { main { padding: 3rem 2rem; } }

  h1 {
    margin: 0 0 1.75rem;
    min-height: 1.2em;
    display: flex;
    align-items: center;
    font-family: var(--display);
    font-size: 1.75rem;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }
  @media (min-width: 640px) { h1 { font-size: 2.125rem; } }

  h1 .ch {
    display: inline-block;
    animation: letter-in 420ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  @keyframes letter-in {
    from { opacity: 0; transform: translateY(0.35em); filter: blur(6px); }
    to   { opacity: 1; transform: none; filter: blur(0); }
  }
  .caret {
    display: inline-block;
    width: 0.07em;
    height: 0.95em;
    margin-left: 0.06em;
    background: var(--fg);
    animation: blink 900ms steps(1) infinite;
  }
  .caret.done { animation: caret-out 600ms ease-out forwards; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes caret-out { from { opacity: 1; } to { opacity: 0; } }

  .row-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 0 0.125rem;
  }

  .label {
    margin: 0;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .count {
    font-family: var(--mono);
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
    color: var(--subtle);
  }

  .field {
    border: 1px solid var(--border);
    border-radius: 0.375rem;
    background: var(--field);
    padding: 0.5rem 0.75rem;
  }

  .big {
    font-family: var(--display);
    font-size: 1.375rem;
    line-height: 1.4;
    letter-spacing: -0.015em;
    color: var(--fg);
  }
  @media (min-width: 640px) { .big { font-size: 1.625rem; } }

  #source {
    display: block;
    width: 100%;
    min-height: 7.5rem;
    resize: none;
    appearance: none;
    border: 0;
    outline: none;
    background: transparent;
    caret-color: var(--fg);
    unicode-bidi: plaintext;
    direction: ltr;
    overflow: hidden;
    padding: 0;
    margin: 0;
  }
  #source::placeholder { color: var(--subtle); }

  section { display: flex; flex-direction: column; gap: 0.75rem; }

  .controls {
    margin-top: 1.5rem;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1.25rem;
  }
  .toggles { display: flex; align-items: flex-end; gap: 1.75rem; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem; }

  .toggle {
    min-height: 38px;
    min-width: 44px;
    padding: 0 0.25rem;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 0.125rem;
    background: none;
    border: 0;
    font: inherit;
    text-align: left;
    color: inherit;
    cursor: pointer;
    opacity: 0.35;
    transition: opacity 150ms ease-out;
  }
  .toggle:hover { opacity: 0.7; }
  .toggle[aria-checked="true"] { opacity: 1; }
  .toggle .name {
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg);
  }
  .toggle .code {
    font-family: var(--mono);
    font-size: 0.6875rem;
    letter-spacing: 0.05em;
    color: var(--muted);
  }

  .btn {
    min-height: 38px;
    padding: 0 0.75rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    appearance: none;
    background: none;
    border: 0;
    border-radius: 0;
    white-space: nowrap;
    font-family: var(--sans);
    font-size: 0.8125rem;
    font-weight: 500;
    letter-spacing: 0.025em;
    color: var(--muted);
    cursor: pointer;
    transition: opacity 150ms ease-out, color 150ms ease-out;
  }
  .btn:hover { color: var(--fg); }
  .btn.primary { color: var(--fg); }
  .btn.primary:hover { opacity: 0.7; }
  .btn:disabled { opacity: 0.4; pointer-events: none; cursor: default; }

  .toggle:focus-visible,
  .btn:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 2px;
  }

  #results { display: none; }
  #results.show { display: block; }

  #out-section { margin-top: 2rem; }

  #output {
    min-height: 8.5rem;
    overflow: hidden;
    unicode-bidi: isolate;
    direction: ltr;
  }
  #output p {
    margin: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  #points-section { margin-top: 2rem; unicode-bidi: isolate; direction: ltr; }
  #points-section .label { margin-bottom: 0.75rem; }

  #points {
    display: flex;
    flex-wrap: wrap;
    gap: 0.375rem 0.5rem;
  }

  .token {
    min-height: 34px;
    min-width: 2rem;
    padding: 0.3rem 0.3rem;
    border-radius: 0.25rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: var(--muted);
    unicode-bidi: isolate;
  }
  .token.mark { background: var(--wash); color: var(--fg); }
  .token .hex {
    font-family: var(--mono);
    font-size: 0.625rem;
    letter-spacing: 0.025em;
  }
  .token .glyph {
    margin-top: 0.25rem;
    line-height: 1;
    font-family: var(--display);
    font-size: 0.95rem;
    white-space: pre;
  }
  .token.mark .glyph {
    font-family: var(--sans);
    font-size: 0.6875rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div class="orbs" aria-hidden="true"><i></i><i></i><i></i></div>
<main dir="ltr">
  <h1 aria-label="godfather"><span id="title-text" aria-hidden="true"></span><span class="caret" id="title-caret" aria-hidden="true"></span></h1>

  <section>
    <div class="row-head">
      <label class="label" for="source">in</label>
      <span class="count" id="in-count">0 chars</span>
    </div>
    <div class="field">
      <textarea id="source" class="big" rows="4" dir="ltr" spellcheck="false"
                placeholder="type…" autocomplete="off" autocapitalize="off"></textarea>
    </div>
  </section>

  <div class="controls">
    <div class="toggles">
      <button type="button" class="toggle" id="toggle-rlo" role="switch" aria-checked="true" aria-label="RLO U+202E">
        <span class="name">RLO</span><span class="code">U+202E</span>
      </button>
      <button type="button" class="toggle" id="toggle-zwj" role="switch" aria-checked="true" aria-label="ZWJ U+200D">
        <span class="name">ZWJ</span><span class="code">U+200D</span>
      </button>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="clear" disabled>clear</button>
      <button type="button" class="btn primary" id="copy" disabled>copy</button>
    </div>
  </div>
  <span class="sr-only" id="status" role="status" aria-live="polite"></span>

  <div id="results">
    <section id="out-section">
      <div class="row-head">
        <p class="label">out</p>
        <span class="count" id="out-count">0 points</span>
      </div>
      <div id="output" class="field big" dir="ltr"><p id="output-text"></p></div>
    </section>

    <section id="points-section" dir="ltr">
      <p class="label">points</p>
      <div id="points"></div>
    </section>
  </div>
</main>

<script>
(function () {
  "use strict";

  var RLO = "\u202e";
  var ZWJ = "\u200d";
  var PDF = "\u202c";
  var LRI = "\u2066";
  var PDI = "\u2069";
  var NAMES = { "202E": "RIGHT-TO-LEFT OVERRIDE", "202C": "POP DIRECTIONAL FORMATTING", "2066": "LEFT-TO-RIGHT ISOLATE", "2069": "POP DIRECTIONAL ISOLATE", "200D": "ZERO WIDTH JOINER" };

  var $ = function (id) { return document.getElementById(id); };
  var source = $("source");
  var inCount = $("in-count");
  var outCount = $("out-count");
  var results = $("results");
  var outputText = $("output-text");
  var pointsEl = $("points");
  var clearBtn = $("clear");
  var copyBtn = $("copy");
  var statusEl = $("status");
  var toggleRlo = $("toggle-rlo");
  var toggleZwj = $("toggle-zwj");

  var state = { rlo: true, zwj: true, output: "" };

  /* ---------- text transforms ---------- */

  function reverseText(value) {
    if (typeof Intl !== "undefined" && Intl.Segmenter) {
      var seg = new Intl.Segmenter(undefined, { granularity: "grapheme" }).segment(value);
      return Array.from(seg, function (p) { return p.segment; }).reverse().join("");
    }
    return Array.from(value).reverse().join("");
  }

  // ---- how the message is wrapped for chat ----------------------------------
  // A flipped (RLO) piece of text that gets split across two chat lines shows its
  // END on the first line and its START on the second. So text is flipped in
  // GROUPS of words:  LRI RLO <group reversed> [PDF] PDI.  The groups stay in normal
  // order, so wrapping between groups is fine. Only a wrap INSIDE a group would
  // come out backwards, so the group boundaries are placed exactly where a line
  // can break, and everything else is packed into big groups. That keeps the
  // invisible-character cost low (a few per message instead of a few per word).
  //
  // Where a line can break is predicted with estimated glyph widths (Helvetica
  // proportions, per 1000 em), calibrated on what really fit on one TikTok line.
  var GW = {
    a:556,b:556,c:500,d:556,e:556,f:278,g:556,h:556,i:222,j:222,k:500,l:222,m:833,n:556,
    o:556,p:556,q:556,r:333,s:500,t:278,u:556,v:500,w:722,x:500,y:500,z:500,
    A:667,B:667,C:722,D:722,E:667,F:611,G:778,H:722,I:278,J:500,K:667,L:556,M:833,N:722,
    O:778,P:667,Q:778,R:722,S:667,T:611,U:722,V:667,W:944,X:667,Y:667,Z:611,
    " ":278,"!":278,"\"":355,"#":556,"$":556,"%":889,"&":667,"'":191,"(":333,")":333,"*":389,
    "+":584,",":278,"-":333,".":278,"/":278,":":278,";":278,"<":584,"=":584,">":584,"?":556,
    "@":1015,"[":278,"\\":278,"]":278,"_":556,"`":333,"{":334,"|":260,"}":334,"~":584
  };
  var SPACE_W = 278;

  function textW(str) {
    var total = 0;
    Array.from(str).forEach(function (ch) {
      if (/\p{Cf}/u.test(ch)) return;                       // invisible format marks: no width
      if (GW[ch] !== undefined) total += GW[ch];
      else total += ch.codePointAt(0) > 0x2000 ? 1000 : 556;  // emoji/wide glyphs vs digits & the rest
    });
    return total;
  }

  // One chat line held up to 21955 and never reached 22177 in these units (three
  // different real messages). A 2.5% margin on both sides covers font differences.
  var CAP_LO = 21955 * 0.975;
  var CAP_HI = 22177 * 1.025;

  // Word indexes that start a new line when lines hold at most `cap`.
  function lineStarts(widths, cap) {
    var starts = [], used = -1;
    for (var i = 0; i < widths.length; i++) {
      if (used < 0) used = widths[i];
      else if (used + SPACE_W + widths[i] <= cap) used += SPACE_W + widths[i];
      else { starts.push(i); used = widths[i]; }
    }
    return starts;
  }

  // Every word that COULD start a line (for any line width in the window) gets a group boundary.
  function groupWords(words) {
    var widths = words.map(textW);
    var lo = lineStarts(widths, CAP_LO), hi = lineStarts(widths, CAP_HI);
    var cut = {};
    for (var k = 0; k < lo.length; k++) {
      var to = k < hi.length ? hi[k] : words.length - 1;
      for (var j = lo[k]; j <= to; j++) cut[j] = true;
    }
    var groups = [], cur = [];
    words.forEach(function (w, i) {
      if (i > 0 && cut[i]) { groups.push(cur); cur = []; }
      cur.push(w);
    });
    groups.push(cur);
    return groups.map(function (g) { return g.join(" "); });
  }

  // Every group costs extra invisible characters, and the chat counts them toward
  // its limit. So the output is built with as much as fits in POINT_BUDGET:
  //   full   : LRI RLO text ZWJ ZWJ PDF PDI
  //   lean 1 : drop PDF (PDI already closes the group)
  //   lean 2 : one ZWJ instead of two
  //   lean 3 : no ZWJ
  var POINT_BUDGET = 100;

  function wrapGroups(groups, opts, tier) {
    return groups.map(function (text) {
      if (text === "") return "";
      var w = reverseText(text);
      for (var i = 0; i < tier.z; i++) w += ZWJ;
      if (opts.rlo) w = LRI + RLO + w + (tier.pdf ? PDF : "") + PDI;
      return w;
    }).join(" ");
  }

  function buildOutput(value, opts) {
    if (!value) return { text: "", lean: false };
    var maxZ = opts.zwj ? 2 : 0;
    var groups = opts.rlo ? groupWords(value.split(" ")) : [value];
    if (!opts.rlo) return { text: wrapGroups(groups, opts, { pdf: false, z: maxZ }), lean: false };

    var tiers = [{ pdf: true, z: maxZ }, { pdf: false, z: maxZ }];
    for (var z = maxZ - 1; z >= 0; z--) tiers.push({ pdf: false, z: z });

    var text = "", idx = 0;
    for (; idx < tiers.length; idx++) {
      text = wrapGroups(groups, opts, tiers[idx]);
      if (Array.from(text).length <= POINT_BUDGET) break;
    }
    if (idx === tiers.length) idx = tiers.length - 1;      // leanest possible, still over budget
    return { text: text, lean: idx > 0 };
  }

  function toCodePoint(ch) {
    var code = ch.codePointAt(0) || 0;
    var hex = code.toString(16).toUpperCase();
    while (hex.length < 4) hex = "0" + hex;
    if (hex === "202E") return { char: ch, hex: hex, label: "RLO", name: NAMES[hex], kind: "rlo" };
    if (hex === "200D") return { char: ch, hex: hex, label: "ZWJ", name: NAMES[hex], kind: "zwj" };
    if (hex === "202C") return { char: ch, hex: hex, label: "PDF", name: NAMES[hex], kind: "pdf" };
    if (hex === "2066") return { char: ch, hex: hex, label: "LRI", name: NAMES[hex], kind: "lri" };
    if (hex === "2069") return { char: ch, hex: hex, label: "PDI", name: NAMES[hex], kind: "pdi" };
    return { char: ch, hex: hex, label: ch, name: "VISIBLE", kind: "visible" };
  }

  function countLabel(n, unit) {
    return n + " " + unit + (n === 1 ? "" : "s");
  }

  /* ---------- rendering ---------- */

  function resizeTextarea() {
    source.style.height = "auto";
    source.style.height = Math.max(source.scrollHeight, 120) + "px";
  }

  function render() {
    var value = source.value;
    var built = buildOutput(value, { rlo: state.rlo, zwj: state.zwj });
    var output = built.text;
    state.output = output;

    var points = Array.from(output).map(toCodePoint);

    inCount.textContent = countLabel(Array.from(value).length, "char");
    outCount.textContent = countLabel(points.length, "point") + (built.lean ? " \u00b7 lean" : "");

    clearBtn.disabled = value.length === 0;
    copyBtn.disabled = output.length === 0;

    if (!output) {
      results.classList.remove("show");
      outputText.textContent = "";
      pointsEl.textContent = "";
    } else {
      results.classList.add("show");
      outputText.textContent = output;

      var frag = document.createDocumentFragment();
      points.forEach(function (pt, index) {
        var isMark = pt.kind !== "visible";
        var tok = document.createElement("div");
        tok.className = "token" + (isMark ? " mark" : "");
        tok.title = pt.name + " \u00b7 index " + index;

        var hex = document.createElement("span");
        hex.className = "hex";
        hex.textContent = "U+" + pt.hex;

        var glyph = document.createElement("span");
        glyph.className = "glyph";
        glyph.textContent = isMark ? pt.label : (pt.char === " " ? "sp" : pt.char);

        tok.appendChild(hex);
        tok.appendChild(glyph);
        frag.appendChild(tok);
      });
      pointsEl.textContent = "";
      pointsEl.appendChild(frag);
    }

    resizeTextarea();
  }

  /* ---------- copy (with 3 layers of fallback) ---------- */

  function legacyCopy(text) {
    var prevFocus = document.activeElement;
    var selStart = null, selEnd = null;
    if (prevFocus === source) { selStart = source.selectionStart; selEnd = source.selectionEnd; }

    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.setAttribute("aria-hidden", "true");
    ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:0;font-size:16px;";
    document.body.appendChild(ta);

    var ok = false;
    try {
      ta.focus({ preventScroll: true });
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      ok = document.execCommand("copy");
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(ta);

    if (prevFocus && typeof prevFocus.focus === "function") {
      try { prevFocus.focus({ preventScroll: true }); } catch (e) {}
      if (selStart !== null) { try { source.setSelectionRange(selStart, selEnd); } catch (e) {} }
    }
    return ok;
  }

  function selectOutputForManualCopy() {
    try {
      var range = document.createRange();
      range.selectNodeContents(outputText);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    } catch (e) {}
  }

  async function copyText(text) {
    // 1) Modern async clipboard API
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        await navigator.clipboard.writeText(text);
        return "ok";
      } catch (e) { /* blocked or not allowed: try next */ }
    }
    // 2) Legacy execCommand
    if (legacyCopy(text)) return "ok";
    // 3) Last resort: highlight the output so the user can press Ctrl/Cmd+C
    selectOutputForManualCopy();
    return "manual";
  }

  var copyTimer = null;
  var copying = false;

  function setCopyLabel(text) {
    copyBtn.textContent = text;
    statusEl.textContent = text;
    if (copyTimer) clearTimeout(copyTimer);
    copyTimer = setTimeout(function () {
      copyBtn.textContent = "copy";
      statusEl.textContent = "";
      copyTimer = null;
    }, 1400);
  }

  async function handleCopy() {
    if (copying || !state.output) return;
    copying = true;
    var text = state.output;               // snapshot at click time
    var result = await copyText(text);
    copying = false;
    setCopyLabel(result === "ok" ? "copied" : "press ctrl+c");
  }

  /* ---------- clear ---------- */

  function handleClear() {
    source.value = "";
    if (copyTimer) { clearTimeout(copyTimer); copyTimer = null; }
    copyBtn.textContent = "copy";
    statusEl.textContent = "";
    render();
    source.focus();
  }

  /* ---------- toggles ---------- */

  function bindToggle(btn, key) {
    btn.addEventListener("click", function () {
      state[key] = !state[key];
      btn.setAttribute("aria-checked", String(state[key]));
      render();
    });
  }

  /* ---------- title: spell it out slowly ---------- */

  function typeTitle() {
    var word = "godfather";
    var box = $("title-text");
    var caret = $("title-caret");
    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduced) {
      box.textContent = word;
      caret.style.display = "none";
      return;
    }
    var i = 0;
    function step() {
      var span = document.createElement("span");
      span.className = "ch";
      span.textContent = word.charAt(i);
      box.appendChild(span);
      i++;
      if (i < word.length) {
        setTimeout(step, 130);          // steady, no gaps between letters
      } else {
        setTimeout(function () { caret.classList.add("done"); }, 700);
      }
    }
    setTimeout(step, 250);
  }

  /* ---------- wire up ---------- */

  source.addEventListener("input", render);
  clearBtn.addEventListener("click", handleClear);
  copyBtn.addEventListener("click", handleCopy);
  bindToggle(toggleRlo, "rlo");
  bindToggle(toggleZwj, "zwj");
  window.addEventListener("resize", resizeTextarea);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resizeTextarea);

  // Browsers can restore old textarea contents on refresh/back; always start empty.
  source.value = "";
  render();
  typeTitle();
  source.focus();
})();
</script>
</body>
</html>
